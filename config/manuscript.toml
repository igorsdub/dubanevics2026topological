# Manuscript map: the only place manuscript numbering lives.
#
# Code, render records and fingerprints keep the stable figure identifier; the
# namer (`dubanevics2026topological.naming`) copies each canonical render to
# `output/figures/<section>/fig<number>_<desc>.png` (tables:
# `output/tables/<section>/tab<number>_<desc>.<ext>`). Renumbering a figure is
# an edit here and a rerun of the namer; nothing is re-rendered.
#
# Keys of each entry:
#   source   canonical file stem under output/figures/canonical/ (tables:
#            output/tables/canonical/); omitted while the render does not exist
#   section  "main", "supplementary" or "exploratory"
#   number   "1", "S3", ...; omitted for exploratory and unassigned entries
#   desc     snake_case file description (single words joined by underscores)
#   external true for panels made outside this repository (Google Slides);
#            exported by hand to output/figures/external/<desc>.png
#   status   "planned" for figures not yet built

