line_value_dy = -3
# The key straddles the dotted median rule on the right of the point cloud: peak and
# valley just above it, synonymous and stop codon just below it, persistence_legend_rule_gap
# px clear of it, right-aligned persistence_legend_inset_x px from the right edge (far
# enough to clear the global-minimum point in the bottom-right corner), no backing box.
# Its font size is median_label_font_size, the "Median-reflected threshold" caption's.
persistence_legend_inset_x = 26
persistence_legend_rule_gap = 6
persistence_legend_line_gap = 2
# The tree's "WT" label overhangs the tree's plot area on the left by about 25 px; Vega-Lite
# would leave that as blank room between the histogram and the tree, so that seam is closed
# by this much (the label overlaps the histogram's empty right edge). Vega stops at the
# histogram's own bounds, so any value of 30 or more leaves the tree 5 px from the bars.
tree_left_overlap_px = 30
# Gap (px) between the histogram, the tree and the diagram: none, the panels touch. The
# diagram's own tick labels (the threshold value) are the only room between tree and diagram.
seam_gap = 0

