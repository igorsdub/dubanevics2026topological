# Appearance of the exploratory branch-decomposition notebook
# (notebooks/papkou2023_branch_decomposition.py). It is not a registered figure, so its
# table sits outside [figures], and `build` leaves the `exploratory` key out of
# every figure's dependency record: editing it never re-renders a publication
# figure. Only the notebook and figures/branch_decomposition_charts.py read it.
# Sizes are layout pixels. The fitness and vertex-count axis titles are
# [rendering] tree_axis_title and branch_count_title.
[exploratory.branch_decomposition]
# Each order gets one row of two panels of this size: fitness of its sequences
# beside the vertex counts of its branches (tree edges).
panel_width = 300
panel_height = 180
# Fitness bins are equal in width over the shared `fitness_domain`; vertex-count
# bins are equal in log10 from 1 to the largest branch.
fitness_bins = 40
vertex_count_bins = 20
histogram_color = "#bdbdbd"
# Width of a stroke in the fill colour around every bar, in layout pixels: it hides
# the pale seams antialiasing leaves between bars of one height (0 for none).
bar_seam_width = 0.5
# Count axis of the fitness histograms (per order and per branch): true draws it on a
# symmetric-log scale, ln(1 + count / log_count_constant), with ticks at 0 and the
# powers of ten, so a handful of functional sequences stays visible beside thousands
# of low-fitness ones, an empty bin sits on the baseline and a count of 1 is not
# flattened; false is linear. A constant below 1 lifts the count of 1 clear of the
# baseline (at 1 the labels 0 and 1 collide on a panel of thousands).
log_count_axis = true
log_count_constant = 0.1
sequence_axis_title = "Sequences"
branch_axis_title = "Branches"
# Per-branch facets: one small fitness histogram per branch, `facet_columns` to a
# row, off until asked for (the notebook's checkbox starts at this value). Every
# font in the facets is facet_font_size, sized for the small panels.
show_branch_facets = false
facet_columns = 4
facet_panel_width = 150
facet_panel_height = 90
facet_font_size = 9
# Where the notebook's "Save PNGs" button writes, relative to the repository root.
# output/ is gitignored, so these are never committed.
png_directory = "output/exploratory/branch_decomposition"

# Exploration only: scripts/layout_exploration.py draws one comparison PNG per
# horizontal tree layout into output/figures/layout_exploration/. It is not a
# publication figure and has no registry entry. The path-to-the-root highlight is
# the path from the root to the summit of the branch that holds the wild type; its
# blue is a diagnostic colour of this script only (red stays wild type, ADR 0012).
[layout_exploration]
panel_width_in = 3.7
panel_height_in = 5.6
dpi = 200
font_size = 8
edge_color = "#8c8c8c"
edge_width = 0.45
path_to_root_color = "#1f4e9c"
path_to_root_width = 1.3
wild_type_size = 150
summit_size = 55

# Seven-column landscape summary table (the presentation specification 5.A, FT-REQ-03).
# `labels` names the state (data/processed/landscape_summary/<state>) of each of the seven columns; the products are
# the table's only scientific input, so `percent_decimals` is the one appearance key.
# A band column shows tree-level rows only. The BY classification behind the BY columns is
# data/processed/classification/<variant>, checked against MANIFEST.tsv.
[tables.landscape_summary]
percent_decimals = 2

[tables.landscape_summary.labels]
"Full (nominal)" = "full"
"Published (point-estimate nominal)" = "published"
"Median-reflected (point-estimate nominal)" = "reflected"
"Published BY (nominal)" = "published_by"
"Published BY (band-simplified)" = "published_by_band"
"Median-reflected BY (nominal)" = "reflected_by"
"Median-reflected BY (band-simplified)" = "reflected_by_band"

# Story views (Decision 10, the presentation specification): which processed states they draw. Each name is
# a directory of data/processed (tree/<state>, landscape/<state>); a view reads each as a saved product and
# rebuilds nothing. tree_persistence draws every nominal tree, bootstrap_band every band tree,
# tree_comparison_views the [comparisons.*] below from both lists. Ridge sweeps are every
# data/processed/ridge_entropy_sweeps/<state> that exists.
[story_views]
nominal_trees = ["full", "published", "reflected", "published_by", "reflected_by"]
band_trees = ["published_by_band", "reflected_by_band"]

# Supplementary S7 reads the Full and Published landscapes' vertices.
[story_views.graph_codon_entropy]
full = "full"
published = "published"

# Registry tables of the story-view figure ids (no settings of their own; appearance is [d10.*]).
[figures.tree_persistence]
registered = true

[figures.bootstrap_band]
registered = true

[figures.tree_comparison_views]
registered = true

# D10 views (opt-in build, the presentation specification Section 6): appearance only, merged over [rendering].
[d10.tree_persistence]
histogram_bins = 200
histogram_height = 70
histogram_color = "#bdbdbd"
colorbar_x_fraction = 0.9
count_legend_ticks = [1, 100, 10000]
panel_gap = 10
annotation_legend_spacing = 190

# The one-row tree_persistence_combined file names its histogram axis like full_tree_persistence.
encoded_histogram_y_title = "Count"

[d10.tree_persistence.tree]

[d10.tree_persistence.persistence]
point_size = 70

# D10 comparison views (shared by tree_comparison_thresholds, _fdr and _band): appearance only, merged over [rendering].
[d10.tree_comparison]
# The peak genotype labels (amino acids and DNA written at each surviving peak) are not drawn.
peak_identity_labels = false
colorbar_x_fraction = 0.9
# The one branch-count colour bar sits inside the top-right panel of the first row, in the free
# space above its tree, centred colorbar_x_fraction of the way across that panel.
# Every panel's fitness axis has this fixed width (px), so plot areas align across panels.
tree_y_axis_extent = 60
count_legend_ticks = [1, 100, 10000]
panel_gap = 10
comparison_panel_gap = 16
legend_length = 110
threshold_color = "#555555"
threshold_width = 1.2
threshold_dash = [5, 4]
threshold_label_font_size = 14
threshold_label_padding = 8

peak_label_font_size = 8
peak_label_offset = 6
# Rotated identity labels whose strips would meet are raised until they clear
# (place_identity_labels). Every peak keeps its name; a moved label gets a leader.
peak_label_char_width_em = 1.0
peak_label_line_height_em = 1.35
peak_label_gap_px = 2
# Headroom above the tallest peak so its rotated identity label is not clipped.
fitness_padding_fraction = 0.2

[d10.tree_comparison.tree]

# D10 view bootstrap_band: appearance only, merged over [rendering]. Absorbed peaks are black, surviving grey.
[d10.bootstrap_band]
panel_gap = 10
# Fixed fitness-axis width (px) so the Nominal and Band-simplified rows align.
tree_y_axis_extent = 60
row_gap = 16
histogram_bins = 40
histogram_height = 70
histogram_color = "#bdbdbd"
colorbar_x_fraction = 0.9
count_legend_ticks = [1, 100, 10000]
annotation_legend_spacing = 190
absorbed_color = "#111111"
band_label = "bootstrap band (2c)"

[d10.bootstrap_band.tree]

[d10.bootstrap_band.persistence]
point_size = 70

# Opt-in registered peak-rank figures (Reference peak set, no titles, no synonymous annotation): appearance only,
# merged over [rendering]. The fitness axis uses the shared fitness_domain and the tree panel's height, so it lines up
# with the tree figures; stop-codon peaks reuse the stop_codon_* marker keys.
[figures.peak_rank]
peak_size = 24
rank_tick_step = 100

[figures.peak_rank_annotated]
peak_size = 24
rank_tick_step = 100

[figures.peak_rank_histogram]
peak_size = 24
rank_tick_step = 100
histogram_bins = 200
histogram_width = 140
histogram_color = "#bdbdbd"

# Opt-in functional_counts_vs_q (Supplementary S2): appearance only, merged over [rendering].
# Counts come from the saved FDR scan; these keys do not change them.
# Opt-in papkou_agreement (Supplementary S1): appearance only.
# hexbin_min is the genotype count at which a panel switches from scatter to bins.
[figures.papkou_agreement]
panel_width = 360
panel_height = 360
panel_gap = 36
point_size = 36
point_color = "#252525"
hexbin_min = 2500
# Hexagons across the panel: a fine bin (70 across a 360 px panel).
hexbin_bins = 70
title = "Agreement with Papkou et al. 2023"

# Opt-in: fitness against its pooled standard error per genotype, a fine hexbin
# with the Spearman rho on the panel.
# Panel size, fonts and axis styling are those of [figures.peak_uncertainty]
# (read at render time); keys set here override them. Sparsest bins: small filled
# light-grey dots (palette LIGHT_GREY unless point_color is set).
[figures.fitness_se_correlation]
point_size = 12
colorbar_orient = "top-right"
hexbin_min = 2500
hexbin_bins = 70
title = "Fitness against standard error"

# Opt-in: Papkou published (left) beside our estimate (right) in the style of
# peak_uncertainty; the wild type is the red star (rendering.wild_type_*) on ours only.
# Axis ranges default to those of peak_uncertainty (set fitness_domain and
# standard_error_domain here to override).
[figures.fitness_vs_pooled_se]
panel_size = 300
panel_gap = 30
font_size = 15
fitness_tick_step = 0.1
standard_error_title = "Pooled fitness SE"
fitness_axis_title = "Fitness (WT = 0)"
sequence_point_size = 12
sequence_color = "#bdbdbd"
sequence_opacity = 0.65
heading_font_size = 18
subtitle_font_size = 14
title_offset = 10
axis_label_padding = 4
axis_title_padding = 8
grid = false

# Opt-in peak_pair_matrices: appearance only. The values come from the
# peak-pair-distances stage. label_mode picks the tick text: "amino_acid" (default),
# "dna" or "both"; stop codons print as %, ^, & and colliding labels stay as they are.
# Schemes are Vega colour schemes; Hamming panels are discrete (one colour per integer),
# fitness panels continuous from 0 to the maximum. The diagonal of the third panel is
# neutral grey.
[figures.peak_pair_matrices]
label_mode = "amino_acid"
cell_size = 14
tick_label_font_size = 9
panel_gap = 40
hamming_scheme = "viridis"
fitness_scheme = "magma"
hamming_difference_scheme = "oranges"
fitness_difference_scheme = "teals"
diagonal_color = "#bdbdbd"
legend_columns = 7
colorbar_length = 160
title = "Peak-pair distances"
subtitle = "Peaks in tree leaf order; nucleotide distances; raw fitness"

# Opt-in peak_pair_hamming_fitness_scatter: appearance only. jitter is the half-width on
# the integer Hamming axis (display only, drawn from jitter_seed). Row 1 is nucleotide,
# row 2 amino-acid Hamming distance; all markers are filled. row_gap is the vertical gap.
[figures.peak_pair_hamming_fitness_scatter]
panel_width = 300
panel_height = 300
panel_gap = 40
point_size = 36
point_opacity = 0.8
point_color = "#252525"
row_gap = 40
jitter = 0.15
jitter_seed = 20261121
title = "Hamming distance against fitness distance"
subtitle = "One point per peak pair; raw fitness"

# Opt-in peak_pair_direct_via_saddle_scatter: appearance only. Square panels
# (panel_size px); Hamming markers are a fixed size (marker_size, px^2), coloured by pair
# count on a log grey scale (count_grey_low = 1 pair to count_grey_high = most); a thin
# grey outline keeps light cells visible on white; fitness points are filled circles
# at fitness_opacity; dash is the diagonal's dash pattern.
[figures.peak_pair_direct_via_saddle_scatter]
panel_size = 300
panel_gap = 40
marker_size = 90
count_grey_low = "#d9d9d9"
count_grey_high = "#1a1a1a"
circle_stroke = "#737373"
circle_stroke_width = 0.5
point_size = 40
fitness_opacity = 0.5
point_color = "#252525"
diagonal_color = "#737373"
dash = [6, 4]
title = "Direct against via-saddle distance"
subtitle = "Dashed line: via saddle equals direct; raw fitness"

[figures.functional_counts_vs_q]
panel_width = 420
panel_height = 280
panel_gap = 24
bar_size = 2
stroke_width = 2
functional_color = "#1b9e77"
uncertain_color = "#d95f02"
non_functional_color = "#7570b3"
title = "Class proportions against the FDR target"
subtitle = "Benjamini-Yekutieli, q from 0 to 1 in steps of 0.01"

# Supplementary S8: the same stacked chart against the Benjamini-Hochberg q and,
# separately, the Bonferroni q. y_max clips the proportion-of-all-genotypes axis.
[figures.functional_counts_vs_q_bh]
panel_width = 420
panel_height = 280
panel_gap = 24
bar_size = 2
y_max = 0.1
functional_color = "#1b9e77"
uncertain_color = "#d95f02"
non_functional_color = "#7570b3"
title = "Class proportions against the Benjamini-Hochberg q"
subtitle = "q from 0 to 1 in steps of 0.01, proportion axis clipped at 0.1"

[figures.functional_counts_vs_q_bonferroni]
panel_width = 420
panel_height = 280
panel_gap = 24
bar_size = 2
y_max = 0.1
functional_color = "#1b9e77"
uncertain_color = "#d95f02"
non_functional_color = "#7570b3"
title = "Class proportions against the Bonferroni q"
subtitle = "q from 0 to 1 in steps of 0.01, proportion axis clipped at 0.1"

# Opt-in: Functional calls at nominal q = 0.05 under Bonferroni, BH and BY,
# for the Published and Candidate thresholds. Counts come from the reviewed
# BY classification snapshot (BH and Bonferroni from its gated p-values).
[figures.multiple_testing_comparison]
width = 420
height = 250
