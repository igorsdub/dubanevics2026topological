entropy_title = ["Entropy", "(bits)"]

# Comparison declarations: [comparisons.<view>_<name>] (the presentation specification Section 3). `tree_state` is
# nominal or band; `panels` is the ordered list of states, each the landscape keys of its tree label (a band
# state adds `bandq`). A panel resolves to the one saved tree whose label carries exactly these keys; the
# comparison hash covers this table and the panels' tree digests, never appearance.
[comparisons.tree_comparison_thresholds_main]
tree_state = "nominal"
panels = [
  { graph = "full" },
  { thr = "published", fdr = "none" },
  { thr = "reflected", fdr = "none" },
]

[comparisons.tree_comparison_fdr_main]
tree_state = "nominal"
panels = [
  { thr = "published", fdr = "none" },
  { thr = "published", fdr = "by", q = 0.05 },
  { thr = "reflected", fdr = "none" },
  { thr = "reflected", fdr = "by", q = 0.05 },
]

[comparisons.tree_comparison_band_main]
tree_state = "band"
panels = [
  { thr = "published", fdr = "by", q = 0.05, bandq = 0.95 },
  { thr = "reflected", fdr = "by", q = 0.05, bandq = 0.95 },
]

# Frameless slide renders (build/slide_trees.py, build/registry_slides.py). The Full graph has tens of
# thousands of stop-codon sequences even among its peaks, so its annotated slides draw smaller crosses;
# every other flavour keeps the shared stop_codon_* style.
[slides]
full_graph_stop_codon_tree_size = 4
full_graph_stop_codon_stroke_width = 0.6
