# Appearance settings for publication figures. Panel dimensions are layout pixels;
# PNG is the default export; SVG is opt-in via `just figures-svg`. PNG exports use 300 dpi and the linked panels target 180 mm at reproduction size.
formats = ["png"]
variants = ["vanilla", "annotated"]
png_dpi = 300
fitness_domain = [-1.2, 1.4]

# Figures `--with-bootstrap` leaves out, each with the reason (printed on every run).
# Explicit figure requests still use their identity guards.
[bootstrap_identity_exclusions]

# Default figures left out while a product they read is missing (printed on every run).
# Remove the entry once the product exists; the figure then renders again.
[missing_product_exclusions]

[rendering]
manuscript_width_mm = 180
font_family = "Arial, Liberation Sans, Helvetica, sans-serif"
font_size = 15
heading_font_size = 18
subtitle_font_size = 14
legend_font_size = 15
tree_axis_title = "Fitness (WT = 0)"
shared_tree_axis_title = "Fitness (at birth, WT = 0)"
persistence_x_title = "Fitness at death"
persistence_y_title = "Fitness (at birth, WT = 0)"
# Horizontal order of the branches in every tree this repository lays out with
# Topographer's make_tree_layout (the band-smoothed trees and the conceptual
# graph_tree_persistence tree), read by tree_horizontal_layout() in
# figures/_layout_config.py and passed to the builders as horizontal_layout (the
# default of the builders is the same value). "subtree_extremum" puts first the child whose whole subtree
# reaches the highest peak, so the highest peak is the leftmost leaf at every fork;
# Topographer also offers "leaf_order" (its default: children by ascending scalar of
# the child node) and "iplotx". The Papkou2023 backbone trees are laid out inside
# Topographer's example, which fixes subtree_extremum itself; this key does not reach
# them. Branch order is presentation only.
tree_horizontal_layout = "subtree_extremum"

# Shared figure geometry and visual defaults. The tree panel size (tree_width x
# tree_height) and persistence panel size are set here once; a figure's `tree` or
# `persistence` table leaves width and height out to use them (load_settings fills
# them) and sets them only to override.
tree_width = 420
tree_height = 250
persistence_width = 250
persistence_height = 250
persistence_point_size = 70
persistence_point_shape = "triangle-up"
persistence_grid = false
panel_gap = 10

# Logarithmic count scale: one colour whose opacity grows with the count (count one is the faintest, with no swatch of its own).
branch_count_title = "Branch\nvertex count"
fitness_tick_step = 0.1
fitness_padding_fraction = 0.05
legend_length = 110
colorbar_top_inset = 8
count_color = "#000000"
# Opacity at count one: clearly visible; the largest count is fully opaque (alpha_max 1.0).
count_alpha_min = 0.3
count_alpha_max = 1.0
# Top histogram above a persistence diagram: the count axis runs from 0 to
# top_histogram_headroom times the tallest bin of the panels that share it (never below the
# last tick), so no bin is clipped; the ticks are exactly top_histogram_count_ticks.
top_histogram_bins = 200
top_histogram_count_ticks = [0, 20000]
top_histogram_headroom = 1.05
# Count labels of the band-smoothed trees of the bootstrap figures (the figures that
# colour a tree by count and carry labels). branch_count_label_mode picks the
# branches: "all" writes the post-absorption vertex count on every branch (the
# terminal ones above their tips, the others under their steps), "tips" only on the
# terminal branches whose count is at most branch_count_label_max. The two main
# ridges of the codon-entropy excerpts keep their own ridge count labels, whatever
# the mode. Every figure with count labels uses this one setting; "all" stays
# available but is not used.
branch_count_label_mode = "tips"
branch_count_label_max = 9
# How a label that collides with another is moved. "nudge" shifts it vertically
# (up above a tip, down under a step, a label height at a time, with a thin leader
# line back to its branch). "rotate" turns every label a quarter turn (reading
# upward), a digit's height wide instead of the text's length, and nudges only a
# collision that remains. Presentation only: changing it re-renders every figure.
branch_count_label_collision = "nudge"
edge_width = 1.2
node_size = 30
# Uncoloured trees (the slide renders' coloring = "none" axis): one plain edge colour, no count colour bar.
plain_edge_color = "#000000"

# WT marker appearance applies to every tree; the stop-codon cross applies to annotated exports.
wild_type_shape = "star"
wild_type_color = "#d62728"
wild_type_size = 200
wild_type_label_color = "#d62728"
wild_type_label_dx = -9
# Wild type and stop codon are solid, never translucent (ADR 0012): they take no
# opacity setting. Red means wild type only; a stop codon is dark crimson (ADR 0012).
stop_codon_shape = "x"
stop_codon_color = "#a50f15"
stop_codon_size = 42
# Size of the stop-codon X on every tree figure, and of the persistence-diagram triangles
# and stop crosses of the combined stop-and-synonymous encoding (the one size setting:
# full_tree_persistence, tree_persistence_combined, bootstrap_combined). Unit: Vega
# point-mark `size`, an AREA in px^2.
stop_codon_tree_size = 70
# Opacity of the stop-codon X on trees (the stroke is thin, 0.5 px).
stop_codon_tree_opacity = 0.7
# Which KINDS of tree node may carry the stop-codon X (the node's own sequence must
# contain a stop codon). Shared by every tree figure and slide. Allowed values:
#   "maximum" - a peak (local maximum, a leaf of the merge tree)
#   "minimum" - a valley: the global minimum (the root of the tree)
#   "saddle"  - a merge point (split or join saddle)
#   "regular" - any other, non-critical vertex of the tree
# Default: peaks and valleys, not saddles. An unknown value stops the build with an error.
stop_codon_tree_node_kinds = ["maximum", "minimum"]
# Trees mark a stop codon with a cross; a persistence panel marks a stop-codon peak
# with a crimson triangle (count opacity, drawn above the other points, no cross).
# Persistence diagram key: inside the diagram, bottom right, one entry per line;
# persistence_legend_inset is the pixel gap to the right and bottom edges.
persistence_legend_inset = 10
# Font size of that key; the long stop label "Stop codon containing peaks" must fit.
persistence_legend_font_size = 11
persistence_legend_line_gap = 4
stop_codon_stroke_width = 0.5
# Synonymous variants are green on the study biological figure (leaf branches and
# persistence triangles); no tree draws them as a square marker.
synonymous_color = "#1b9e77"
synonymous_opacity = 0.95
# The combined stop-and-synonymous encoding (full-graph figures and the *_combined D10
# files): a synonymous peak or valley is teal. synonymous_teal is the diagram marker and
# key glyph (faded by the branch-count opacity); the tree's synonymous leaf branches run
# from synonymous_teal_light (count one) to synonymous_teal_dark (largest count) on the
# same log scale as the grey count ramp. A stop codon is the red cross drawn on top of
# the marker, in exactly the tree's cross style (stop_codon_color, stop_codon_stroke_width,
# stop_codon_tree_opacity, stop_codon_tree_size).
synonymous_teal = "#00897b"
synonymous_teal_light = "#a1dad2"
synonymous_teal_dark = "#00362f"

