[project]
name = "dubanevics2026topological"
version = "1.0.1"
description = "Code and data pipeline for: Topological characterization of combinatorial fitness landscapes using merge trees"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<4.0"
dependencies = [
  "topographer[plotting]>=0.5.0,<0.6",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
  "marimo>=0.10",
  "watchfiles>=0.21",
  "barseqfit>=0.2.0,<0.3",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "joblib>=1.6.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0",
  "ruff>=0.15",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dubanevics2026topological"]

[tool.uv.sources]
topographer = { git = "https://github.com/oist/topographer.git", tag = "v0.5.0" }
barseqfit = { git = "https://github.com/oist/barseqfit.git", tag = "v0.2.0" }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["B018"]
